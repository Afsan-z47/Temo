name: Package native builds

# Runs on every push to main and on version tags. You can also trigger it
# manually from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: PROJECT-Enigma-windows
          - os: macos-latest
            artifact-name: PROJECT-Enigma-macos
          - os: ubuntu-latest
            artifact-name: PROJECT-Enigma-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # jpackage cannot cross-compile, so this step runs natively on each OS
      # in the matrix above and produces that OS's real app.
      - name: Build native app image
        run: ./gradlew lwjgl3:jpackageImage --no-daemon
        shell: bash

      - name: Upload app image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: lwjgl3/build/jpackage/*

  create_release:
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: Release ${{ github.ref_name }} generated by CI
          draft: false
          prerelease: false

      - name: Upload assets to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ steps.create_release.outputs.upload_url }}
        run: |
          # strip the templated part "{?name,label}" from upload_url
          UPLOAD_URL="${UPLOAD_URL%\{*}"
          for f in artifacts/*; do
            echo "Uploading $f to release ${{ github.ref_name }}"
            curl -sS -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" \
              "$UPLOAD_URL?name=$(basename "$f")"
          done
